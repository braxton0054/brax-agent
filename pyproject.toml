[build-system]
requires = ["setuptools>=64.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brax-agent"
version = "1.0.0"
description = "Open Source Multi-Agent AI Dev Team"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "httpx>=0.25.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "gitpython>=3.1.0",
    "textual>=0.52.0",
]

[project.optional-dependencies]
all = [
    "anthropic>=0.30.0",
    "openai>=1.0.0",
    "groq>=0.5.0",
    "ollama>=0.1.0",
]
anthropic = ["anthropic>=0.30.0"]
openai = ["openai>=1.0.0"]
groq = ["groq>=0.5.0"]
ollama = ["ollama>=0.1.0"]

[project.scripts]
brax = "brax.cli.main:app"

[tool.setuptools.packages.find]
include = ["brax*"]
